# nginx na frente do RPG IA: entrega os arquivos estáticos direto (rápido, com cache longo, porque os
# endereços têm ?v=<versão>) e passa o resto para o gunicorn. Já deixa pronto o WebSocket do futuro modo
# online (o cabeçalho Upgrade passa para o jogo). __DOMINIO__ é trocado pelo instalar.sh.

map $http_upgrade $conexao_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMINIO__;

    # nenhum pedido do jogo passa de 512 KB (o Flask também barra)
    client_max_body_size 1m;

    # não conta a versão do nginx para quem procura servidores desatualizados
    server_tokens off;
    # o navegador não "adivinha" tipos de arquivo, o jogo não abre dentro de site alheio (iframe) e o
    # endereço do jogo não vaza para os links externos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # com HTTPS ligado, o navegador passa a ir direto no https por 6 meses
    add_header Strict-Transport-Security "max-age=15552000" always;

    # conexões "lentas de propósito" (slowloris) não seguram o servidor; e um IP não abre conexões sem fim
    # (300 é folgado: uma escola com 50 jogadores no mesmo IP abre algumas por navegador)
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 20s;
    keepalive_timeout 30s;
    limit_conn rpgia_conexoes 300;

    # robôs procurando WordPress, PHP, .env, .git...: o jogo não tem nada disso, fecha a conexão na hora
    # (o /.well-known fica livre: é por ele que o Let's Encrypt renova o certificado)
    location ~* (^/\.(?!well-known)|\.php$|\.aspx?$|wp-admin|wp-login|xmlrpc|phpmyadmin|cgi-bin|/\.env|/\.git) {
        return 444;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /opt/rpgia/static/;
        expires 30d;
        add_header Cache-Control "public";
        # um add_header aqui dentro apaga os de fora: repete os de segurança
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        access_log off;
    }

    location / {
        # limite por IP: 60 pedidos/s com folga de 200 de uma vez (só um robô passa disso)
        limit_req zone=rpgia_pedidos burst=200 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # o IP de verdade do jogador (o jogo usa nos limites). $remote_addr, e não o que o navegador mandar,
        # para ninguém conseguir se passar por outro endereço
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexao_upgrade;
        proxy_read_timeout 75s;
    }
}
