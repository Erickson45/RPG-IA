# RPG IA: as zonas de limite por IP (precisam ficar no nível http; o site usa em deploy/nginx-rpgia.conf).
# Folgadas de propósito: 50 jogadores saindo do mesmo IP (uma escola) fizeram ~25 pedidos/s no teste.
# Quem passa do limite recebe 429 em vez de derrubar o jogo; quem insiste é banido pelo fail2ban.
# (Os tempos limite contra conexões lentas ficam no site: o nginx.conf do Ubuntu já define alguns aqui no
# nível http e repetir daria erro.)
limit_req_zone $binary_remote_addr zone=rpgia_pedidos:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=rpgia_conexoes:10m;
limit_req_status 429;
limit_conn_status 429;
# nível "error": o Ubuntu só grava erros no error.log, e é de lá que o fail2ban lê os abusos
limit_req_log_level error;
limit_conn_log_level error;
