    # o Salão do multijogador (salao.py, serviço rpgia-salao): WebSocket. Fica aberto enquanto o jogador
    # está no lobby (o salão manda um "ping" a cada 20 s, então a conexão nunca fica parada 1 hora).
    # O atualizar.sh põe este bloco antes do "location /" do site, se ele ainda não estiver lá.
    location = /salao {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

